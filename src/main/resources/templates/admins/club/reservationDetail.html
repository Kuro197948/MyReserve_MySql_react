<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>[[${title}]]</title>

<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container mt-4">

    <h1 class="mb-4 text-center">予約詳細</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">
        処理が完了しました。
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
        エラーが発生しました。
    </div>

    <div th:if="${hasPendingCancelRequest == true}" class="alert alert-warning text-center">
        この予約はキャンセル申請中です。申請内容を確認して承認・却下を行ってください。
    </div>

    <div th:if="${hasPendingChangeRequest == true}" class="alert alert-warning text-center">
        この予約は変更申請中です。申請内容を確認して承認・却下を行ってください。
    </div>

    <table class="table table-bordered align-middle">
        <tr>
            <th>ID</th>
            <td th:text="${reservation.id}">1</td>
        </tr>

        <tr>
            <th>予約日時</th>
            <td th:text="${#temporals.format(reservation.reservationDate, 'yyyy/MM/dd HH:mm')}">
                2026/05/01 12:00
            </td>
        </tr>

        <tr>
            <th>人数</th>
            <td>
                <span th:text="${reservation.peopleCount}">2</span>名
            </td>
        </tr>

        <tr>
            <th>代表者名</th>
            <td th:text="${reservation.representativeName}">山田太郎</td>
        </tr>

        <tr>
            <th>電話番号</th>
            <td th:text="${reservation.phoneNumber}">090-0000-0000</td>
        </tr>

        <tr>
            <th>コース名</th>
            <td th:text="${reservation.courseName != null and !#strings.isEmpty(reservation.courseName) ? reservation.courseName : 'コース未設定'}">
                コース未設定
            </td>
        </tr>

        <tr>
            <th>備考</th>
            <td th:text="${reservation.remarks != null and !#strings.isEmpty(reservation.remarks) ? reservation.remarks : 'なし'}">
                なし
            </td>
        </tr>

        <tr>
            <th>ステータス</th>
            <td>
                <span class="reservation-status-badge"
                      th:classappend="${reservation.status == 'RESERVED'} ? ' status-reserved' : ' status-default'"
                      th:text="${reservation.statusLabel}">
                    予約中
                </span>

                <span th:if="${hasPendingCancelRequest == true}"
                      class="reservation-request-badge reservation-request-cancel-badge ms-1">
                    キャンセル申請中
                </span>

                <span th:if="${hasPendingChangeRequest == true}"
                      class="reservation-request-badge reservation-request-change-badge ms-1">
                    変更申請中
                </span>
            </td>
        </tr>

        <tr>
            <th>作成日時</th>
            <td th:text="${#temporals.format(reservation.createdAt, 'yyyy/MM/dd HH:mm')}">
                2026/05/01 12:00
            </td>
        </tr>
    </table>

    <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">

        <a th:href="@{/admins/club/reservations}" class="btn btn-outline-secondary">
            現在予約へ戻る
        </a>

        <a th:href="@{/admins/club/reservations/history}" class="btn btn-outline-secondary">
            予約履歴へ戻る
        </a>

        <a th:if="${isCancelableReservation == true and hasPendingRequest != true}"
           th:href="@{/admins/club/reservations/edit/{id}(id=${reservation.id})}"
           class="btn btn-outline-primary">
            予約情報を編集
        </a>

        <form th:if="${isCancelableReservation == true and hasPendingRequest != true}"
              th:action="@{/admins/club/reservations/delete/{id}(id=${reservation.id})}"
              method="post"
              onsubmit="return confirm('この予約をキャンセル済みにして、予約履歴へ移動しますか？');">
            <button type="submit" class="btn btn-outline-danger">
                キャンセル済みにする
            </button>
        </form>

        <button th:if="${hasPendingCancelRequest == true}"
                type="button"
                class="btn btn-outline-danger"
                disabled>
            キャンセル申請中
        </button>

        <button th:if="${hasPendingChangeRequest == true}"
                type="button"
                class="btn btn-outline-primary"
                disabled>
            変更申請中
        </button>

        <button th:if="${reservation.canceled}"
                type="button"
                class="btn btn-secondary"
                disabled>
            キャンセル済み
        </button>

        <button th:if="${reservation.completed}"
                type="button"
                class="btn btn-secondary"
                disabled>
            完了済み
        </button>

        <button th:if="${reservation.reserved and isCancelableReservation != true}"
                type="button"
                class="btn btn-secondary"
                disabled>
            予約日を過ぎています
        </button>

    </div>

</div>

</body>
</html>
