<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title}">予約履歴</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
  <section class="admin-history-page">

    <div class="admin-history-header">
      <h1 class="admin-history-title">予約履歴</h1>
      <p class="admin-history-description">
        キャンセル済み・完了した過去の予約履歴を確認できます。
      </p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">
      予約履歴を削除しました。
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
      エラーが発生しました。
    </div>

    <div th:if="${reservations != null and !#lists.isEmpty(reservations)}">

      <div class="admin-history-card" th:each="r : ${reservations}">

        <div class="admin-history-card-header">
          <div>
            <span class="admin-history-status"
                  th:text="${r.statusLabel}">
              キャンセル済み
            </span>

            <h2 class="admin-history-card-title">
              <span th:text="${r.courseName != null and !#strings.isEmpty(r.courseName) ? r.courseName : 'コース未設定'}">
                コース未設定
              </span>
            </h2>
          </div>

          <span class="admin-history-date"
                th:text="${#temporals.format(r.reservationDate, 'yyyy/MM/dd HH:mm')}">
            2026/04/30 17:22
          </span>
        </div>

        <div class="admin-history-body">
          <p>
            <strong>ID：</strong>
            <span th:text="${r.id}">6</span>
          </p>

          <p>
            <strong>人数：</strong>
            <span th:text="${r.peopleCount}">3</span>名
          </p>

          <p>
            <strong>代表者名：</strong>
            <span th:text="${r.representativeName}">dddd</span>
          </p>

          <p>
            <strong>電話番号：</strong>
            <span th:text="${r.phoneNumber}">0000000</span>
          </p>

          <p th:if="${r.remarks != null and !#strings.isEmpty(r.remarks)}">
            <strong>備考：</strong>
            <span th:text="${r.remarks}">備考</span>
          </p>

          <p>
            <strong>予約作成日：</strong>
            <span th:text="${#temporals.format(r.createdAt, 'yyyy/MM/dd HH:mm')}">
              2026/04/16 13:42
            </span>
          </p>
        </div>

        <div class="admin-history-actions">
          <form th:action="@{/admins/club/reservations/history/{id}/delete(id=${r.id})}"
                method="post"
                onsubmit="return confirm('この予約履歴を削除しますか？');">
            <button type="submit" class="btn btn-outline-danger btn-sm">
              履歴から削除
            </button>
          </form>
        </div>

      </div>
    </div>

    <div class="admin-history-empty"
         th:if="${reservations == null or #lists.isEmpty(reservations)}">
      現在、予約履歴はありません。
    </div>

    <div class="admin-history-back-wrap">
      <a th:href="@{/admins/club/reservations}" class="admin-history-back-link">
        予約一覧へ戻る
      </a>

      <a th:href="@{/admins/club/home}" class="admin-history-back-link">
        管理ホームへ戻る
      </a>
    </div>

  </section>
</div>

</body>
</html>
