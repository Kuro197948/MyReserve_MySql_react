<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>[[${title}]]</title>

<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div class="container mt-4">

    <h1 class="mb-4 text-center">予約一覧</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">
        処理が完了しました。
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
        エラーが発生しました。
    </div>

    <div th:if="${reservations != null and !#lists.isEmpty(reservations)}">

        <table class="table table-striped table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>予約日時</th>
                    <th>人数</th>
                    <th>代表者名</th>
                    <th>電話番号</th>
                    <th>コース</th>
                    <th>ステータス</th>
                    <th>操作</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="reservation : ${reservations}">
                    <td th:text="${reservation.id}">1</td>

                    <td th:text="${#temporals.format(reservation.reservationDate, 'yyyy/MM/dd HH:mm')}">
                        2026/05/01 12:00
                    </td>

                    <td>
                        <span th:text="${reservation.peopleCount}">2</span>名
                    </td>

                    <td th:text="${reservation.representativeName}">山田太郎</td>

                    <td th:text="${reservation.phoneNumber}">090-0000-0000</td>

                    <td th:text="${reservation.courseName != null and !#strings.isEmpty(reservation.courseName) ? reservation.courseName : 'コース未設定'}">
                        コース未設定
                    </td>

                    <td th:text="${reservation.statusLabel}">
                        予約中
                    </td>

                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/admins/club/reservations/{id}(id=${reservation.id})}"
                               class="btn btn-sm btn-primary">
                                詳細
                            </a>

                            <form th:action="@{/admins/club/reservations/delete/{id}(id=${reservation.id})}"
                                  method="post"
                                  onsubmit="return confirm('この予約をキャンセル扱いにして、予約履歴へ移動しますか？');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    キャンセル扱い
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <div th:if="${reservations == null or #lists.isEmpty(reservations)}"
         class="alert alert-info text-center">
        現在、予約はありません。
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/admins/club/reservations/history}" class="btn btn-outline-primary">
            予約履歴を見る
        </a>

        <a th:href="@{/admins/club/home}" class="btn btn-secondary ms-2">
            管理ホームへ戻る
        </a>
    </div>

</div>

</body>
</html>
