<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>[[${title}]]</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <div class="gb-container">

    <th:block th:if="${session.loginId}">
		<div id="admin-home-root"
		     th:attr="
		       data-today-reservation-count=${todayReservationCount != null ? todayReservationCount : 0},
		       data-pending-request-count=${pendingRequestCount != null ? pendingRequestCount : 0},
		       data-monthly-reservation-count=${monthlyReservationCount != null ? monthlyReservationCount : 0},
		       data-member-count=${memberCount != null ? memberCount : 0}
		     ">
		  React読み込み中...
		</div>
    </th:block>

  </div>

  <script type="module">
    import RefreshRuntime from "http://localhost:5175/@react-refresh";
    RefreshRuntime.injectIntoGlobalHook(window);
    window.$RefreshReg$ = () => {};
    window.$RefreshSig$ = () => (type) => type;
    window.__vite_plugin_react_preamble_installed__ = true;
  </script>

  <script type="module" src="http://localhost:5175/@vite/client"></script>
  <script type="module" src="http://localhost:5175/src/adminHomeMain.jsx"></script>
</body>
</html>
