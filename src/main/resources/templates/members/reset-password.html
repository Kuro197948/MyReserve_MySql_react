<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>パスワード再設定</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">パスワード再設定</h2>

                    <p class="text-muted text-center mb-4">
                        新しいパスワードを入力してください。
                    </p>

                    <form th:action="@{/members/password/reset}" th:object="${form}" method="post">
                        <input type="hidden" th:field="*{token}">

                        <div class="mb-3">
                            <label for="password" class="form-label">新しいパスワード</label>
                            <input
                                type="password"
                                id="password"
                                th:field="*{password}"
                                class="form-control"
                                placeholder="新しいパスワードを入力">
                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">確認用パスワード</label>
                            <input
                                type="password"
                                id="confirmPassword"
                                th:field="*{confirmPassword}"
                                class="form-control"
                                placeholder="確認用パスワードを入力">
                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                パスワードを更新する
                            </button>
                        </div>
                    </form>

                    <div class="mt-3 text-center">
                        <a th:href="@{/members/login}">ログイン画面へ戻る</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
