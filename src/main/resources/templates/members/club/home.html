<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>[[${title}]]</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">

  <!-- Reactで描画する上部エリア -->
  <div id="member-home-top-widget"></div>

  <div class="mt-4">

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h3 class="mb-0">新着情報</h3>
    </div>

    <div th:if="${latestNews != null and !#lists.isEmpty(latestNews)}">
      <div class="card mb-3" th:each="n : ${latestNews}">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <h5 class="card-title mb-1">
              <a th:href="@{/members/club/announcements/{id}(id=${n.id})}"
                 th:text="${n.title}">タイトル</a>
            </h5>
            <small class="text-muted" th:text="${#temporals.format(n.postDate,'yyyy/MM/dd')}">2026/03/03</small>
          </div>

          <small class="text-muted" th:text="${n.author}">投稿者</small>

          <p class="card-text mt-2"
             th:text="${n.detail != null ? #strings.abbreviate(n.detail.article, 160) : '本文はありません'}">
            本文…
          </p>
        </div>
      </div>
    </div>

    <div class="alert alert-secondary" th:if="${latestNews == null or #lists.isEmpty(latestNews)}">
      新着情報はありません
    </div>

  </div>

</div>

<!-- Vite開発サーバーからReactを読み込む -->
<script type="module">
  import RefreshRuntime from 'http://localhost:5175/@react-refresh'
  RefreshRuntime.injectIntoGlobalHook(window)
  window.$RefreshReg$ = () => {}
  window.$RefreshSig$ = () => (type) => type
  window.__vite_plugin_react_preamble_installed__ = true
</script>

<script type="module" src="http://localhost:5175/@vite/client"></script>
<script type="module" src="http://localhost:5175/src/memberHomeTopMain.jsx"></script>
</body>
</html>
