<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title}">予約確認</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
  <section class="member-reservation-page">

    <div class="reservation-page-header">
      <h1 class="reservation-page-title">予約確認</h1>
      <p class="reservation-page-description">
        現在の予約状況を確認できます。
      </p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">
      処理が完了しました。
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
      エラーが発生しました。
    </div>

    <div th:if="${reservations != null and !#lists.isEmpty(reservations)}">
      <div class="reservation-card" th:each="r : ${reservations}">

        <div class="reservation-card-header">
          <h2 class="reservation-card-title">
            <span th:text="${r.courseName != null and !#strings.isEmpty(r.courseName) ? r.courseName : 'コース未設定'}">
              コース名
            </span>
          </h2>

          <span class="reservation-status" th:text="${r.statusLabel}">
            予約中
          </span>
        </div>

        <div class="reservation-card-body">
          <p>
            <strong>予約日時：</strong>
            <span th:text="${#temporals.format(r.reservationDate, 'yyyy/MM/dd HH:mm')}">
              2026/05/01 12:00
            </span>
          </p>

          <div class="reservation-countdown"
               th:classappend="${r.daysUntilReservationClass}">
            <span class="reservation-countdown-icon">📅</span>
            <span th:text="${r.daysUntilReservationLabel}">
              予約日まであと3日です
            </span>
          </div>

          <p>
            <strong>人数：</strong>
            <span th:text="${r.peopleCount}">2</span>名
          </p>

          <p>
            <strong>代表者名：</strong>
            <span th:text="${r.representativeName}">山田太郎</span>
          </p>

          <p>
            <strong>電話番号：</strong>
            <span th:text="${r.phoneNumber}">090-0000-0000</span>
          </p>

          <p th:if="${r.remarks != null and !#strings.isEmpty(r.remarks)}">
            <strong>備考：</strong>
            <span th:text="${r.remarks}">備考</span>
          </p>
        </div>

        <div class="reservation-card-actions">
          <a th:href="@{/members/club/reservations/{id}(id=${r.id})}"
             class="btn btn-outline-primary">
            詳細を見る
          </a>
        </div>

      </div>
    </div>

    <div class="reservation-empty"
         th:if="${reservations == null or #lists.isEmpty(reservations)}">
      現在、予約はありません。
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4">
      <a th:href="@{/members/club/reservations/history}" class="btn btn-outline-secondary">
        予約履歴を見る
      </a>

      <a th:href="@{/members/club/home}" class="btn btn-secondary">
        ホームへ戻る
      </a>
    </div>

  </section>
</div>

</body>
</html>
